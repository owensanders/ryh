name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Publish Ziggy Configuration
        run: php artisan ziggy:generate

      - name: Check Generated Types
        run: |
          php artisan typescript:transform
          git diff --exit-code resources/js/types || { echo "::error::resources/js/types is out of date with app/Data. Run: sail artisan typescript:transform"; exit 1; }
          if [ -n "$(git ls-files --others --exclude-standard resources/js/types)" ]; then echo "::error::typescript:transform created files that aren't committed."; exit 1; fi

      - name: Build Assets
        run: npm run build

      # Here rather than in the frontend job: app.ts imports Ziggy from vendor/.
      - name: Type-check Frontend
        run: npx vue-tsc --noEmit

      - name: Tests
        run: ./vendor/bin/phpunit

  e2e:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025

    # Real env vars win over .env.e2e, pointing it at the service containers.
    env:
      CI: true
      APP_ENV: e2e
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: password
      MAIL_HOST: 127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Vite reads .env, so the build gets the e2e app name and Echo settings.
      - name: Build Assets
        run: cp .env.e2e .env && npm run build

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end Tests
        run: npm run e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
