<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Offline - HouseHub</title>
        <style>
            :root {
                --bg: #eeeae3;
                --card: #ffffff;
                --ink: #0e1a2b;
                --ink3: rgba(14, 26, 43, 0.56);
                --line: rgba(14, 26, 43, 0.09);
                --coral: #ff4f40;
                color-scheme: light dark;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #07090f;
                    --card: #151a25;
                    --ink: #f2f5f9;
                    --ink3: rgba(242, 245, 249, 0.62);
                    --line: rgba(255, 255, 255, 0.09);
                }
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 16px;
                box-sizing: border-box;
                background: var(--bg);
                color: var(--ink);
                font-family:
                    Figtree,
                    system-ui,
                    -apple-system,
                    sans-serif;
            }
            main {
                width: 100%;
                max-width: 380px;
                padding: 28px;
                box-sizing: border-box;
                border: 1px solid var(--line);
                border-radius: 22px;
                background: var(--card);
                text-align: center;
            }
            svg {
                width: 56px;
                height: 56px;
            }
            h1 {
                margin: 18px 0 6px;
                font-size: 19px;
                font-weight: 800;
                letter-spacing: -0.01em;
            }
            p {
                margin: 0;
                font-size: 14px;
                line-height: 1.5;
                color: var(--ink3);
            }
            button {
                margin-top: 22px;
                width: 100%;
                min-height: 46px;
                border: 0;
                border-radius: 14px;
                background: var(--coral);
                color: #fff;
                font: inherit;
                font-size: 15px;
                font-weight: 700;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <rect width="512" height="512" rx="112" fill="#ff4f40" />
                <g transform="translate(64 64) scale(16)" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                    <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                </g>
            </svg>
            <h1>You're offline</h1>
            <p>HouseHub needs a connection for this page. It'll load again as soon as you're back online.</p>
            <button type="button" onclick="location.reload()">Try again</button>
        </main>
        <script>
            // Reload once the server is reachable again: on the browser's
            // `online` event, and every few seconds in case that comes before
            // the network really works (or never comes, on Wi-Fi with no internet).
            async function reloadWhenReachable() {
                try {
                    const response = await fetch('/up', { cache: 'no-store' });
                    if (response.ok) {
                        location.reload();
                    }
                } catch {
                    // Still offline; try again shortly.
                }
            }
            window.addEventListener('online', reloadWhenReachable);
            setInterval(reloadWhenReachable, 5000);
        </script>
    </body>
</html>
